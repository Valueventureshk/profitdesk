type = "web_pixel_extension"
name = "ProfitDesk tracking"
runtime_context = "strict"
uid = "4a2e75be-b1bb-1b58-a67c-e2492826383e3bf0752a"

# Shopify only runs the pixel for shoppers who allowed analytics + marketing in the store's
# cookie banner (where the store has one), like any other tracking app.
[customer_privacy]
analytics = true
marketing = true
preferences = false
sale_of_data = "enabled"

[settings]
type = "object"

[settings.fields.accountID]
name = "Store key"
description = "Set by ProfitDesk: which store the events belong to"
type = "single_line_text_field"
validations = [{ name = "min", value = "8" }]

[settings.fields.endpoint]
name = "Endpoint"
description = "Set by ProfitDesk: where events are sent"
type = "single_line_text_field"
