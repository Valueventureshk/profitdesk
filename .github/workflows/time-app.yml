# Builds the EcomVital Time desktop app (desktop/time_app.py) for Windows and Mac (Apple chip + Intel) and puts the
# installers in static/downloads/, which the Time desk's "Get the app" page links to. Runs when desktop/ changes.
name: EcomVital Time app

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/time-app.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            out: EcomVital-Time-windows.exe
          - os: macos-14
            out: EcomVital-Time-mac-apple.zip
          - os: macos-15-intel
            out: EcomVital-Time-mac-intel.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller mss pillow pynput psutil
          if [ "$RUNNER_OS" = "macOS" ]; then pip install pyobjc-framework-Quartz pyobjc-framework-Cocoa; fi
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd desktop
          pyinstaller --noconfirm --onefile --windowed --name "EcomVital Time" --icon ../static/brand/ecomvital-1024.png \
            --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 time_app.py
          "dist/EcomVital Time.exe" --selftest || true
          mkdir -p ../out && cp "dist/EcomVital Time.exe" "../out/${{ matrix.out }}"
      - name: Build (Mac)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cd desktop
          pyinstaller --noconfirm --windowed --name "EcomVital Time" --osx-bundle-identifier com.ecomvital.time \
            --icon ../static/brand/ecomvital-1024.png \
            --hidden-import pynput.keyboard._darwin --hidden-import pynput.mouse._darwin time_app.py
          "dist/EcomVital Time.app/Contents/MacOS/EcomVital Time" --selftest || true
          mkdir -p ../out && ditto -c -k --keepParent "dist/EcomVital Time.app" "../out/${{ matrix.out }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.out }}
          path: out/${{ matrix.out }}

  publish:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Put the installers on the download page
        run: |
          mkdir -p static/downloads
          found=0
          for f in built/*/*; do cp "$f" static/downloads/; found=1; done
          [ "$found" = 1 ] || { echo "nothing built"; exit 1; }
          grep -m1 '^APP_VERSION' desktop/time_app.py | sed 's/.*"\(.*\)".*/\1/' > static/downloads/version.txt
          ls -la static/downloads
          git config user.name "EcomVital build"
          git config user.email "build@ecomvital.com"
          git add static/downloads
          git commit -m "EcomVital Time installers $(cat static/downloads/version.txt)" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
