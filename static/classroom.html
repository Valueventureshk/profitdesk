<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcomVital · Classroom</title>
<script>try{var t=localStorage.getItem("pdTheme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;if((localStorage.getItem("pdSkin")||"new")==="new")document.documentElement.classList.add("skin-new");}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap">
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/skin.css">
<link rel="stylesheet" href="/static/classroom.css">
</head>
<body>
<div class="cash-page">
  <header class="cash-top">
    <div class="brand" data-section-menu title="Switch section">
      <span class="brand-mark"><img src="/static/brand/ecomvital-120.png" alt=""></span>
      <span class="brand-name">EcomVital</span>
    </div>
    <div class="crumb">
      <h1>Classroom</h1>
      <p id="sub">Recorded training for the team: watch, read the transcript, follow the steps</p>
    </div>
    <div class="controls">
      <button class="btn btn-ghost" id="sections" data-manage-only>Sections</button>
      <button class="btn btn-primary" id="newCourse" data-manage-only>+ New course</button>
    </div>
  </header>

  <main class="content">
    <section id="home">
      <div class="cl-bar">
        <div class="cl-chips" id="chips"></div>
        <input type="search" class="control cl-search" id="q" placeholder="Search courses">
      </div>
      <div id="grid"></div>
    </section>

    <section id="course" hidden>
      <a href="#" class="cl-back" id="back">← All courses</a>
      <div class="cl-course">
        <aside class="cl-side panel">
          <div class="cl-side-head">
            <strong id="cTitle"></strong>
            <div class="cl-prog"><i id="cBar"></i></div><span class="hint" id="cProg"></span>
            <div class="cl-side-acts" data-manage-only>
              <button class="btn btn-sm" id="editCourse">Edit course</button>
              <button class="btn btn-sm btn-primary" id="newLesson">+ Lesson</button>
            </div>
          </div>
          <ol class="cl-lessons" id="lessons"></ol>
        </aside>
        <article class="cl-main" id="lesson"></article>
      </div>
    </section>
  </main>
</div>

<div class="cl-modal" id="modal" hidden><div class="cl-box" role="dialog" aria-modal="true"><div id="modalBody"></div></div></div>
<div id="toast" class="toast" hidden></div>
<script src="/static/nav.js"></script>
<script src="/static/chat.js"></script>
<script src="/static/classroom.js"></script>
</body>
</html>
