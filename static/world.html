<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EcomVital · World</title>
<script>try{var t=localStorage.getItem("pdTheme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;if((localStorage.getItem("pdSkin")||"new")==="new")document.documentElement.classList.add("skin-new");}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&display=swap">
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/skin.css">
<link rel="stylesheet" href="/static/world.css">
</head>
<body class="world-page" data-no-rail>
<div id="stage" aria-label="The store, drawn from above, with one figure per shopper"></div>
<div class="w-demo-frame" aria-hidden="true"></div>
<div id="demoBanner" class="w-demo-banner" hidden>DEMO — simulated visitors · not real shoppers or orders</div>

<header class="w-top">
  <div class="w-left">
    <div class="brand ctl" data-section-menu title="Switch section">
      <span class="brand-mark"><img src="/static/brand/ecomvital-120.png" alt=""></span>
      <span class="brand-name">World</span>
    </div>
    <div class="w-title">
      <h1 id="storeName">…</h1>
      <div class="w-badges"><span id="badge" class="w-badge wait">LIVE · connecting…</span><span id="fresh" class="w-fresh"></span></div>
    </div>
  </div>
  <div class="w-tools ctl">
    <div class="w-seg" role="group" aria-label="Live or demo">
      <button data-mode="live">Live</button><button data-mode="demo">Demo</button>
    </div>
    <button id="focusBtn" class="w-btn" title="Zoom to the store">Store</button>
    <button id="allBtn" class="w-btn" title="See the whole district">District</button>
    <button id="tvBtn" class="w-btn" title="For a wall screen: no buttons, the camera moves by itself (Esc to leave)">TV mode</button>
    <button id="fsBtn" class="w-btn w-icon" title="Full screen" aria-label="Full screen">&#x26F6;</button>
    <button id="setBtn" class="w-btn w-icon" title="Settings" aria-label="Settings">&#9881;</button>
    <a class="w-btn w-back" href="/" title="Back to the dashboard">Dashboard</a>
  </div>
</header>

<div id="setPop" class="w-pop ctl" hidden>
  <h3>When is a shopper inactive?</h3>
  <label>Inactive (grey) after <input id="setIn" type="number" min="1" max="60" step="1"> min with no activity</label>
  <label>Leaves the store after <input id="setOut" type="number" min="2" max="240" step="1"> min</label>
  <p id="setNote" class="w-note"></p>
  <p id="setErr" class="w-err"></p>
  <div class="w-pop-btns"><button id="setClose" class="w-btn">Close</button><button id="setSave" class="w-btn w-primary">Save</button></div>
</div>

<aside class="w-stats">
  <section class="w-card">
    <div class="w-k">In the store now</div>
    <div class="w-big"><span id="active">–</span><small>active</small></div>
    <ul class="w-break">
      <li><i class="d browsing"></i>Browsing <b id="n-browsing">–</b></li>
      <li><i class="d cart"></i>Has a cart <b id="n-cart">–</b></li>
      <li><i class="d checkout"></i>In checkout <b id="n-checkout">–</b></li>
      <li class="muted"><i class="d inactive"></i>Inactive <b id="n-inactive">–</b></li>
    </ul>
    <p id="activeHint" class="w-hint"></p>
  </section>
  <section class="w-card w-today">
    <div class="w-k">Purchases today</div>
    <div class="w-big"><span id="todayN">–</span><small id="todayV"></small></div>
    <p id="todayDay" class="w-hint"></p>
  </section>
</aside>

<div id="tip" class="w-tip" hidden></div>
<div id="toasts" class="w-toasts" aria-live="polite"></div>
<div id="tvHint" class="w-tvhint">TV mode · press Esc or double-click to leave</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/8.6.6/pixi.min.js"></script>
<script src="/static/nav.js"></script>
<script src="/static/world-env.js"></script>
<script src="/static/world-chars.js"></script>
<script src="/static/world.js"></script>
</body>
</html>
