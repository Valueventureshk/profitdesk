<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcomVital · Tasks</title>
<script>try{var t=localStorage.getItem("pdTheme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;if((localStorage.getItem("pdSkin")||"new")==="new")document.documentElement.classList.add("skin-new");}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;550;600;650;700&display=swap">
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/skin.css">
<link rel="stylesheet" href="/static/tasks.css">
</head>
<body class="tk-body">
<div class="cash-page tk-page">
  <header class="cash-top">
    <div class="brand" data-section-menu title="Switch section">
      <span class="brand-mark"><img src="/static/brand/ecomvital-120.png" alt=""></span>
      <span class="brand-name">EcomVital</span>
    </div>
    <div class="crumb">
      <h1>Tasks</h1>
      <p id="sub">Listing, landing pages and ads: give the work, check it, launch it</p>
    </div>
    <nav class="scm-pages" id="pages">
      <button data-page="board" class="on">Board</button>
      <button data-page="history">History</button>
      <button data-page="day" data-manage-only>End of day</button>
    </nav>
  </header>

  <main class="content">
    <div class="tk-bar" id="bar">
      <div class="scm-searchbox tk-search"><span>⌕</span><input id="q" type="search" placeholder="Search tasks, collections, links"></div>
      <select id="fPerson" class="control" data-manage-only><option value="">Everyone</option></select>
      <select id="fStore" class="control"><option value="">All stores</option></select>
      <button class="btn btn-primary" id="newTask" data-manage-only>+ New task</button>
    </div>

    <section id="boardPage" class="tk-board"></section>

    <section id="historyPage" class="panel" hidden>
      <div class="table-wrap"><table class="table tk-hist" id="hist"></table></div>
    </section>

    <section id="dayPage" hidden>
      <div class="tk-bar">
        <label class="tk-inline">Day <input type="date" id="day" class="control"></label>
        <select id="dayPerson" class="control"><option value="">Everyone</option></select>
      </div>
      <div id="dayOut" class="tk-day"></div>
    </section>
  </main>
</div>

<!-- one task, opened from a card -->
<div class="drawer tk-drawer" id="drawer" hidden>
  <div class="drawer-scrim" data-close></div>
  <div class="drawer-panel">
    <div class="drawer-head"><h2 id="dTitle">Task</h2><button class="btn btn-sm btn-ghost" data-close>Close</button></div>
    <div class="drawer-body" id="dBody"></div>
  </div>
</div>

<!-- new / edit task -->
<div class="drawer tk-drawer" id="editor" hidden>
  <div class="drawer-scrim" data-close></div>
  <div class="drawer-panel">
    <div class="drawer-head"><h2 id="eTitle">New task</h2><button class="btn btn-sm btn-ghost" data-close>Close</button></div>
    <div class="drawer-body">
      <div class="scm-pages tk-kind" id="eKind">
        <button data-kind="listing" class="on">Listing + ads</button>
        <button data-kind="custom">Custom task</button>
      </div>
      <label class="field"><span>Title <em class="tk-opt" data-listing>(leave empty to use “List &lt;collection&gt;”)</em></span><input id="eName" class="control" maxlength="200"></label>
      <div class="tk-row">
        <label class="field"><span>Store</span><select id="eStore" class="control"><option value="">No store</option></select></label>
        <label class="field"><span>Give it to</span><select id="eWho" class="control"><option value="">Nobody yet</option></select></label>
      </div>
      <div class="tk-row">
        <label class="field"><span>Due</span><input type="date" id="eDue" class="control"></label>
        <label class="field"><span>Priority</span><select id="ePrio" class="control"><option value="normal">Normal</option><option value="high">High</option></select></label>
      </div>
      <label class="field"><span>Special notes <em class="tk-opt">(staff always see this first)</em></span><textarea id="eNotes" class="control" rows="3"></textarea></label>

      <div data-listing>
        <label class="field"><span>Collection to list</span><input id="eCollection" class="control" placeholder="e.g. Autumn knitwear"></label>
        <label class="field"><span>Products <em class="tk-opt">(links or names, one per line)</em></span><textarea id="eProducts" class="control" rows="3"></textarea></label>
        <div class="field"><span>What to build</span>
          <div class="tk-checks" id="ePages"></div></div>
        <label class="field"><span>Ad angle / copy direction</span><textarea id="eAngle" class="control" rows="3"></textarea></label>
        <label class="field"><span>Headline ideas <em class="tk-opt">(one per line)</em></span><textarea id="eHeadlines" class="control" rows="2"></textarea></label>
        <div class="tk-row">
          <label class="field"><span>Daily budget (ad account currency)</span><input id="eBudget" class="control" inputmode="decimal" placeholder="50"></label>
          <label class="field"><span>Countries</span><input id="eCountries" class="control" placeholder="US CA GB"></label>
        </div>
      </div>
      <label class="field" data-custom-only><span>What needs doing</span><textarea id="eDesc" class="control" rows="6"></textarea></label>
      <label class="field" data-listing><span>Anything else</span><textarea id="eDesc2" class="control" rows="2"></textarea></label>
      <p class="hint">Reference files (product photos, examples) can be added once the task is made.</p>
      <div class="row-actions"><button class="btn btn-primary" id="eSave">Create task</button></div>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<script src="/static/nav.js"></script>
<script src="/static/chat.js"></script>
<script src="/static/tasks.js"></script>
</body>
</html>
