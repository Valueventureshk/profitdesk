<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcomVital · PayPal Tracking</title>
<script>try{var t=localStorage.getItem("pdTheme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;if((localStorage.getItem("pdSkin")||"new")==="new")document.documentElement.classList.add("skin-new");}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap">
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/skin.css">
<link rel="stylesheet" href="/static/paypaltrack.css">
</head>
<body>
<div class="cash-page">
  <header class="cash-top">
    <div class="brand" data-section-menu title="Switch section">
      <span class="brand-mark"><img src="/static/brand/ecomvital-120.png" alt=""></span>
      <span class="brand-name">EcomVital</span>
    </div>
    <div class="crumb">
      <h1>PayPal Tracking</h1>
      <p id="sub">Sends each PayPal order's tracking number to PayPal once the parcel is in transit (from SCM).</p>
    </div>
    <div class="controls">
      <button id="preview" class="btn btn-ghost" data-manage-only title="Check everything now and show what would be sent. Sends nothing.">Preview (sends nothing)</button>
      <button id="runNow" class="btn btn-primary" data-manage-only title="Send the ready ones now instead of waiting for the next 15-minute run">Run now</button>
    </div>
  </header>

  <main class="content">
    <div id="problems" class="warnings"></div>

    <section class="panel pt-switch" id="switchPanel">
      <div class="pt-main">
        <label class="pt-toggle"><input type="checkbox" id="on" data-manage-only><span class="pt-knob"></span></label>
        <div>
          <strong id="onText">Off</strong>
          <p class="hint" id="onNote"></p>
        </div>
      </div>
      <div class="pt-stores">
        <div class="pt-label">Stores it sends for</div>
        <div id="stores" class="pt-picks"></div>
      </div>
      <label class="pt-later"><input type="checkbox" id="later" data-manage-only>
        <span>Also send parcels already past "in transit" (ready for pickup, out for delivery, delivered), e.g. ones that moved on before the app was switched on</span></label>
      <p class="hint" id="lastRun"></p>
    </section>

    <section id="cards" class="cards"></section>

    <section class="panel">
      <div class="pt-filters">
        <div class="exp-periods pt-tabs" id="tabs">
          <button data-s="sent" class="on">Sent <b data-n="sent"></b></button>
          <button data-s="ready">Ready to send <b data-n="ready"></b></button>
          <button data-s="waiting">Waiting for in transit <b data-n="waiting"></b></button>
          <button data-s="unmatched">Not matched <b data-n="unmatched"></b></button>
          <button data-s="error,failed">Errors <b data-n="errors"></b></button>
          <button data-s="">All</button>
        </div>
        <div class="pt-search">
          <select id="storeFilter"><option value="">All stores</option></select>
          <input type="search" id="q" placeholder="Order, customer, email, tracking or PayPal number">
        </div>
      </div>
      <div class="table-wrap"><table class="table pt-list" id="list"><tbody><tr><td class="hint">Loading…</td></tr></tbody></table></div>
    </section>
  </main>
</div>
<div id="toast" class="toast" hidden></div>
<script src="/static/nav.js"></script>
<script src="/static/chat.js"></script>
<script src="/static/paypaltrack.js"></script>
</body>
</html>
