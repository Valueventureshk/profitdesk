<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcomVital · Sheets</title>
<script>try{var t=localStorage.getItem("pdTheme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;if((localStorage.getItem("pdSkin")||"new")==="new")document.documentElement.classList.add("skin-new");}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap">
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/skin.css">
<link rel="stylesheet" href="/static/sheets.css">
</head>
<body>
<div class="cash-page">
  <header class="cash-top">
    <div class="brand" data-section-menu title="Switch section">
      <span class="brand-mark"><img src="/static/brand/ecomvital-120.png" alt=""></span>
      <span class="brand-name">EcomVital</span>
    </div>
    <div class="crumb">
      <h1>Sheets</h1>
      <p id="sub">The team's Google Sheets, backed up every 15 minutes with full history and a daily log</p>
    </div>
    <div class="controls">
      <span class="hint" id="gstate"></span>
      <a class="btn btn-ghost" id="gsign" href="/auth/sheets/start" target="_blank" data-manage-only>Sign in with Google</a>
      <button class="btn btn-primary" id="add" data-manage-only>+ Add a Sheet</button>
    </div>
  </header>

  <main class="content sh-wrap">
    <aside class="panel sh-list" id="list"></aside>
    <section class="sh-main" id="main">
      <div class="panel sh-empty">Loading…</div>
    </section>
  </main>
</div>
<div class="sh-modal" id="modal" hidden><div class="sh-box" role="dialog" aria-modal="true"><div id="modalBody"></div></div></div>
<div id="toast" class="toast" hidden></div>
<script src="/static/nav.js"></script>
<script src="/static/chat.js"></script>
<script src="/static/sheets.js"></script>
</body>
</html>
