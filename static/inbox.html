<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EcomVital · Inbox</title>
<script>try{var t=localStorage.getItem("pdTheme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;if((localStorage.getItem("pdSkin")||"new")==="new")document.documentElement.classList.add("skin-new");}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap">
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/skin.css">
</head>
<body>
<div class="cash-page inbox-page">
  <header class="cash-top">
    <div class="brand" data-section-menu title="Switch section">
      <span class="brand-mark"><img src="/static/brand/ecomvital-120.png" alt=""></span>
      <span class="brand-name">EcomVital</span>
    </div>
    <div class="crumb">
      <h1>Inbox</h1>
      <p id="sub">Loading…</p>
    </div>
    <div class="scm-pages inbox-tabs" id="inboxTabs">
      <button data-tab="mail" class="on">Email</button>
      <button data-tab="social">Comments &amp; Messages<span class="tab-badge" id="socialBadge" hidden></span></button>
      <button data-tab="bulk">Bulk email<span class="tab-badge" id="bulkBadge" hidden></span></button>
    </div>
    <div class="controls">
      <select id="mailboxSelect" class="control mail-only"></select>
      <select id="socialStore" class="control social-only" title="Store or Facebook Page"></select>
      <button id="refresh" class="btn btn-ghost">Refresh</button>
    </div>
  </header>
  <div id="aiWarn" class="warnings"></div>
  <main class="inbox inbox3" id="mailMain">
    <nav class="inbox-nav" id="nav">
      <div class="inbox-search"><input type="search" id="inboxSearch" class="control" placeholder="Search order #, name, email…" autocomplete="off"></div>
      <div class="inav-label">Mail</div>
      <button data-view="all"><i>✉</i>All mail<b data-count="all"></b></button>
      <button data-view="excluded" class="sub" title="Emails hidden from All mail (order confirmations, payment notices…)"><i>⊘</i>Excluded<b data-count="excluded"></b></button>
      <button data-view="customer"><i>☺</i>Customer<b data-count="customer"></b></button>
      <button data-view="inquiry"><i>?</i>Inquiry + legal<b data-count="inquiry"></b></button>
      <button data-view="inquiry_done" class="sub"><i>✓</i>Done<b data-count="inquiry_done"></b></button>
      <div class="inav-label">Tickets</div>
      <button data-view="scm" class="on"><i>⇄</i>SCM · order<b data-count="scm"></b></button>
      <button data-view="cs"><i>♥</i>CS · product<b data-count="cs"></b></button>
      <button data-view="unlabelled"><i>•</i>Not labelled<b data-count="unlabelled"></b></button>
      <button data-view="escalated"><i>!</i>Escalated<b data-count="escalated"></b></button>
      <button data-view="snoozed"><i>☾</i>Snoozed<b data-count="snoozed"></b></button>
      <div class="inav-label">Done</div>
      <button data-view="records"><i>▤</i>Records<b data-count="records"></b></button>
      <div id="labelNav"></div>
      <div class="inav-label" data-manage-only>Teach the AI</div>
      <button data-view="training" data-manage-only><i>✎</i>AI training<b data-count="questions"></b></button>
    </nav>
    <aside class="inbox-list" id="list"></aside>
    <section class="inbox-read" id="read">
      <p class="hint inbox-empty">Pick a ticket or email.</p>
    </section>
  </main>
  <main class="bulk-main" id="bulk" hidden>
    <aside class="bulk-side"><button class="btn btn-primary btn-block" id="bulkNew" data-write-only>+ New bulk email</button>
      <div id="bulkList" class="bulk-list"></div></aside>
    <section class="bulk-body" id="bulkBody"><p class="hint">Pick a bulk email, or make a new one.</p></section>
  </main>
  <main class="inbox inbox3 social" id="social" hidden>
    <nav class="inbox-nav" id="snav">
      <div class="inbox-search"><input type="search" id="socialSearch" class="control" placeholder="Search name or words…" autocomplete="off"></div>
      <div class="inav-label">Comments</div>
      <button data-sview="needs_reply" class="on"><i>✎</i>Needs a reply<b data-scount="needs_reply"></b></button>
      <button data-sview="all"><i>☰</i>All comments</button>
      <button data-sview="ads" class="sub" title="Comments on ads only"><i>◎</i>On ads</button>
      <button data-sview="hidden"><i>⊘</i>Hidden<b data-scount="hidden"></b></button>
      <button data-sview="matches" title="Visible comments with a hide word, written before auto-hide was on"><i>!</i>Has a hide word<b data-scount="matches"></b></button>
      <button data-sview="done"><i>✓</i>Done</button>
      <div class="inav-label">Messenger</div>
      <button data-sview="chats_open"><i>✉</i>Waiting on us<b data-scount="chats_open"></b></button>
      <button data-sview="chats_all" class="sub"><i>☷</i>All chats</button>
      <div class="inav-label">Setup</div>
      <button data-sview="pages"><i>⚑</i>Pages &amp; stores</button>
      <button data-sview="words"><i>⚙</i>Hide words</button>
    </nav>
    <aside class="inbox-list" id="slist"></aside>
    <section class="inbox-read" id="sread"><p class="hint inbox-empty">Pick a comment or chat.</p></section>
  </main>
</div>
<div id="toast" class="toast" hidden></div>
<script src="/static/nav.js"></script>
<script src="/static/chat.js"></script>
<script src="/static/inbox.js"></script>
<script src="/static/social.js"></script>
<script src="/static/bulk.js"></script>
</body>
</html>
