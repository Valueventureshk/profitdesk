<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProfitDesk · Log in</title>
<script>try{var t=localStorage.getItem("pdTheme")||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="setup">
  <form class="setup-card" id="form" autocomplete="on">
    <div class="setup-mark">PD</div>
    <h1 id="title">Log in to ProfitDesk</h1>
    <p class="setup-sub" id="sub">Use the email and password you were given.</p>

    <label class="field" id="codeField" hidden>
      <span>Setup code</span>
      <input id="code" type="password" autocomplete="off">
    </label>
    <label class="field" id="nameField" hidden>
      <span>Your name</span>
      <input id="name" type="text" autocomplete="name">
    </label>
    <label class="field">
      <span>Email</span>
      <input id="email" type="email" autocomplete="username" required>
    </label>
    <label class="field">
      <span>Password</span>
      <input id="password" type="password" autocomplete="current-password" required>
    </label>
    <label class="field" id="confirmField" hidden>
      <span>Password again</span>
      <input id="confirm" type="password" autocomplete="new-password">
    </label>

    <button class="btn btn-primary btn-block" id="go" type="submit">Log in</button>
    <p class="notice" id="notice" hidden></p>

    <details class="advanced" id="restoreBox" hidden>
      <summary>Moving ProfitDesk? Restore a backup instead</summary>
      <p class="hint">Upload a backup downloaded from another ProfitDesk (Settings → Backup).
        Everything comes across, including its logins. Enter the setup code above first.</p>
      <input id="file" type="file" accept=".db">
      <button class="btn btn-ghost btn-block" id="restore" type="button" style="margin-top:8px">Restore backup</button>
    </details>
  </form>
</div>
<script>
  // The server fills this in: true when no account exists yet.
  const FIRST_RUN = __FIRST_RUN__;
  const NEEDS_CODE = __NEEDS_CODE__;
  const $ = (id) => document.getElementById(id);

  if (FIRST_RUN) {
    $("title").textContent = "Create the owner account";
    $("sub").textContent = "ProfitDesk has no accounts yet. This first one is yours. " +
      "You can add your partner afterwards in Settings → People.";
    $("nameField").hidden = false;
    $("confirmField").hidden = false;
    $("password").autocomplete = "new-password";
    $("go").textContent = "Create account";
    $("codeField").hidden = !NEEDS_CODE;
    $("restoreBox").hidden = false;
  }

  $("restore").onclick = async () => {
    const notice = $("notice");
    const f = $("file").files[0];
    if (!f) { notice.textContent = "Choose the backup file first."; notice.hidden = false; return; }
    $("restore").disabled = true;
    try {
      const r = await fetch("/api/first-restore", {
        method: "POST", headers: { "X-Setup-Code": $("code").value }, body: f,
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.error || "Couldn't restore that backup.");
      alert(`Restored ${body.stores} stores. Log in with your usual email and password.`);
      location.href = "/login";
    } catch (err) {
      notice.textContent = err.message;
      notice.hidden = false;
      $("restore").disabled = false;
    }
  };

  function next() {
    const n = new URLSearchParams(location.search).get("next") || "/";
    return n.startsWith("/") && !n.startsWith("//") ? n : "/";  // stay on this site
  }

  $("form").onsubmit = async (e) => {
    e.preventDefault();
    const notice = $("notice");
    notice.hidden = true;
    if (FIRST_RUN && $("password").value !== $("confirm").value) {
      notice.textContent = "The two passwords don't match.";
      notice.hidden = false;
      return;
    }
    $("go").disabled = true;
    try {
      const r = await fetch(FIRST_RUN ? "/api/first-user" : "/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          name: $("name").value, email: $("email").value, password: $("password").value,
          setup_code: $("code").value,
        }),
      });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.error || "Couldn't log in.");
      location.href = next();
    } catch (err) {
      notice.textContent = err.message;
      notice.hidden = false;
      $("go").disabled = false;
    }
  };
</script>
</body>
</html>
